formula = "mol-land-branch"
description = "land {{branch}} for {{merge_bead}} through review, CI, and the {{repo}} merge slot"
type = "workflow"

[vars.merge_bead]
required = true
description = "the unparented role=shepherd merge bead; the shepherd claims this and nothing else"

[vars.node_bead]
required = true
description = "the work bead whose branch is landing; supplies `origin_actor` and `worktree`"

[vars.repo]
required = true
description = "repository the branch lands in; owns the merge slot"

[vars.branch]
required = true
description = "branch being landed, read from the merge bead's author-written branch anchor"

[vars.want_fix_round]
default = "false"
description = "true when a reviewer returned changes_requested and the specialist must re-work before the PR is made ready"

[[steps]]
id = "open-draft-pr"
title = "open the draft PR for {{branch}}"
type = "task"
priority = 1
labels = ["land", "phase:stage"]
description = """
Open the PR as a DRAFT against the landing base. Draft is the interlock: the
shepherd's own eligibility probe ignores drafts, so nothing can merge {{branch}}
while review is still open.

The branch and base anchors on {{merge_bead}} are author-written. Read them;
never write them. If the pushed head does not match the branch anchor, stop and
set {{merge_bead}} status=blocked with a BLOCKED comment -- a mismatch means the
work bead was not reported from the branch this molecule is landing.
"""

[[steps]]
id = "create-review-shells"
title = "create every review-wisp shell before any reviewer starts"
type = "task"
priority = 1
needs = ["open-draft-pr"]
labels = ["land", "phase:review"]
description = """
The orchestrator creates ALL review-wisp shells with metadata role=reviewer,
parented under the owning epic, and the {{merge_bead}} dependency edges before
spawning reviewers. Each reviewer discovers work with
`bd ready --include-ephemeral --parent <epic> --metadata-field role=reviewer --unassigned --claim --json`.
Creating shells as reviewers finish can omit a required review dimension.

A reviewer is code-readonly, not Beads-readonly: it must claim its wisp, write
the verdict and findings on the linked {{node_bead}}, close a completed approving
wisp, and clear its assignee. It needs no checkout and never writes a worktree.
Do not run it under `bd --readonly`. The shepherd uses
`bd ready --metadata-field role=shepherd --unassigned --claim --json` without a
parent.
"""

[[steps]]
id = "restage-to-review"
title = "move {{node_bead}} from reported to in_review"
type = "task"
needs = ["create-review-shells"]
labels = ["land", "phase:review"]
description = """
`bd set-state {{node_bead}} state=in_review --reason "<why>"`.

Restaging after the shells exist, not before, is what keeps the state honest: a
node in `in_review` with no wisp to review it reads as work in progress that no
actor owns.
"""

[[steps]]
id = "collect-verdicts"
title = "collect one verdict per review dimension"
type = "task"
priority = 1
needs = ["restage-to-review"]
labels = ["land", "phase:review"]
description = """
Every review dimension reaches a verdict before the specialist is woken. Reviewers
write durable REVIEW comments and actionable findings on the linked {{node_bead}},
not solely on ephemeral wisps. Each verdict carries dimension and verdict=approve
or verdict=changes, plus head_sha and review_round tokens from its wisp, falling
back to the linked node for each missing field. Omit a token only when neither
endpoint carries it. The orchestrator observes those comments without relaying
findings, and the shepherd never judges them.

The union of current-head/current-round verdicts decides the route: all approve
and the PR may be made ready; any verdict=changes routes through fix-round.
Only after every dimension reports changes or approval, and only when changes
are required, restore {{node_bead}} to its implementer queue: preserve the owning
epic and scope, set status=open with an empty assignee, and let a fresh implementer
pull it. Never activate a worker with a bead-id message.
"""

[[steps]]
id = "fix-round"
title = "apply the union of FIX items on {{node_bead}}"
type = "task"
needs = ["collect-verdicts"]
condition = "{{want_fix_round}}"
labels = ["land", "phase:review", "route:changes-requested"]
description = """
An implementer pulls the reopened {{node_bead}} using
`bd ready --parent <epic> --metadata-field role=implementer --unassigned --claim --json`,
reads all review dimensions, and resolves their union rather than only the first.
It records evidence for rejected findings and applies accepted fixes.

The replacement works in isolation, never the feature worktree, and never pushes.
OMP 18.1.14 captures commits plus remaining working-tree delta only on a
successful child result; failed or aborted work may not survive. The architect
collects the actual capture, integrates it, and pushes. A new head restarts
collect-verdicts: every verdict must match the new head.
"""

[[steps]]
id = "mark-ready"
title = "make the draft PR ready for review"
type = "task"
needs = ["collect-verdicts", "fix-round"]
labels = ["land", "phase:stage"]
description = """
The last approving reviewer closes the final review wisp and makes the PR ready.
`collect-verdicts` is named here unconditionally on purpose -- with fix-round
alone this step would lose its only edge when no fix round runs and become ready
in parallel with the first step, marking an unreviewed PR ready with no error
reported anywhere.

Ready is the signal the shepherd's eligibility probe waits for. Until this step
runs, the draft state holds the merge.
"""

[[steps]]
id = "ci-green"
title = "wait for CI to go green on the final head"
type = "task"
priority = 1
needs = ["mark-ready"]
labels = ["land", "phase:verify"]
description = """
Nothing polls this gate and no daemon closes it. The RUNNER is the shepherd's own
patrol pass, whose first action every cycle is `bd gate check --type=gh`; that
call is what resolves this gate and lets {{merge_bead}} re-enter the queue. If no
shepherd is patrolling {{repo}}, this molecule waits forever.

Point the gate at the actual run first: `bd gate discover` finds the run id for a
`gh:run` gate, and the gate names no target otherwise. `bd gate check --escalate`
marks a failed run for attention, which is the entry to mol-bounce.

Never hold the merge slot across this wait.
"""

[steps.gate]
type = "gh:run"
timeout = "30m"

[[steps]]
id = "acquire-slot"
title = "acquire the {{repo}} merge slot without waiting"
type = "task"
priority = 1
needs = ["ci-green"]
labels = ["land", "phase:land"]
description = """
`bd merge-slot create` is idempotent, once per run, with a stable holder such as
`run-<id>-shepherd`. Acquire WITHOUT `--wait`.

Contention is advisory: on a busy slot report the current holder and retry after
release rather than proceeding. Release on every exit path -- success, conflict,
CI wait, bounce, and failure. On restart, `bd merge-slot check` and verify remote
state before releasing a slot whose holder is your own stable actor.
"""

[[steps]]
id = "merge"
title = "merge {{branch}} under an atomic head guard"
type = "task"
priority = 1
needs = ["acquire-slot"]
labels = ["land", "phase:land"]
description = """
Revalidate the exact PR head, base, checks, review state, and dependencies from
GitHub with `gh` immediately before merging, then merge with an atomic head
guard. A head that moved between ci-green and here is a stale merge, not a
mergeable one.

Stamp `integration_owner=orchestrate` on {{merge_bead}} so unrelated global shepherds
leave it alone. Never push a commit, edit the PR body, resolve a conflict, or close the
PR as a substitute for a bounce.
"""

[[steps]]
id = "verify-landed"
title = "prove the exact landing and close {{merge_bead}}"
type = "task"
priority = 1
needs = ["merge"]
labels = ["land", "phase:verify"]
description = """
Prove the landing before recording it: the merge commit must contain the exact
head that was guarded. Then
`bd update {{merge_bead}} --metadata '{"pr":<n>,"merge_sha":"<sha>"}'` and close
{{merge_bead}}.

For same-PR bounce fixes, retain their nonterminal landing records until this
proof succeeds. Verify each fix's recorded integration/review/CI evidence
matches the guarded landed head, then stamp its actual landing evidence and
close it. Removing a merge-to-fix blocker after approval is not itself evidence
of landing and never authorizes early fix closure. Separate prerequisite-PR
fixes must already have their own verified landing before this merge is ready.

Closing it unblocks the `[wisp:recovery] wipe-worktree <path>` wisp; reclaim that
checkout through `worktree-sweep.sh` and close the wisp. Release the merge slot
and the repository sheepdog with your own `bd` calls, and clear the sheepdog's
assignee -- a closed wisp still naming you refuses the successor's claim.
"""
