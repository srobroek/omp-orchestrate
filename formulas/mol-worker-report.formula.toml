formula = "mol-worker-report"
description = "static exit sequence a worker runs to close out {{bead}}"
type = "workflow"

[vars.bead]
required = true
description = "the bead being reported"

[vars.evidence]
default = "git"
description = "git (local commit; capture follows successful result), artifact (write a file and cite it), or none"

[vars.spawned_children]
default = "false"
description = "did this worker delegate to children of its own"

[[steps]]
id = "self-verify"
title = "run the verification {{bead}} asks for"
type = "task"
priority = 0
labels = ["report", "phase:exit"]
description = """
Tests, lint, build -- whatever the bead's acceptance criteria name. Failing
verification is a reportable outcome, not a reason to skip the step. Never
report success over a failing run.
"""

[[steps]]
id = "children-reported"
title = "confirm every child of {{bead}} reported"
type = "task"
priority = 0
needs = ["self-verify"]
condition = "{{spawned_children}}"
labels = ["report", "phase:exit"]
description = """
Collect each delegated job's final result and confirm no child still writes
before producing evidence. An unassigned reported child may remain in_progress
pending review/integration; status alone is not liveness. Integrate successful
isolated child results where required, then re-run verification. Missing or failed
results require an explicit disposition, never a success report over partial work.
"""

[[steps]]
id = "commit-push"
title = "commit the work for {{bead}}"
type = "task"
needs = ["self-verify", "children-reported"]
condition = "{{evidence}} == git"
labels = ["report", "phase:exit"]
description = """
Commit inside the isolated workspace you were given -- the session cwd, never
the architect's feature worktree. Do not push or merge. With
`task.isolation.apply: false`, OMP 18.1.14 captures commits AND remaining
working-tree delta on an `omp/task/<id>` branch after a successful child result.
Local commits are useful evidence, not a durable failure checkpoint: failed or
aborted isolated work may not survive cleanup.

Cite the local SHA and expected branch in the outcome, distinguishing them from
confirmed parent-side capture. The parent must collect the successful task result
and verify its actual branch/head before integrating.
"""

[[steps]]
id = "write-artifact"
title = "write the artifact for {{bead}}"
type = "task"
needs = ["self-verify", "children-reported"]
condition = "{{evidence}} == artifact"
labels = ["report", "phase:exit"]
description = "Write one file under the stamped artifacts dir and record its path on the bead."

[[steps]]
id = "stamp-outcome"
title = "record the outcome on {{bead}}"
type = "task"
needs = ["self-verify", "children-reported", "commit-push", "write-artifact"]
labels = ["report", "phase:exit"]
description = """
One comment carrying the verdict, the evidence pointer (sha or artifact path),
and anything left undone. Set the state label; do not invent a status bd cannot
hold.

If this work revealed a reusable lesson, update an existing memory or record a
new one here. Skip memory work when the bead already contains the useful outcome.
Do not create a separate step or memory merely to log completion.
"""

[[steps]]
id = "release-yield"
title = "release {{bead}} and yield the report"
type = "task"
needs = ["stamp-outcome"]
labels = ["report", "phase:exit"]
description = """
Finish the role's evidence and handoff stamps, set state:reported for completed
work, and clear the assignee with `bd update {{bead}} --assignee ""`.
Leave reported work in_progress for review and integration; do not close it
prematurely. Yield the result and exit, without claiming more work or idling for
review. A later worker pulls any reopened fix from the durable role queue and
reads the bead's evidence; bounce-back does not depend on this session surviving.
"""
