formula = "mol-dead-claim-recovery"
description = "recover {{bead}} from an actor that stopped reporting, without stealing live work"
type = "workflow"

[vars.bead]
required = true
description = "the bead whose claim looks dead"

[vars.actor]
required = true
description = "the actor named in the bead's assignee"

[vars.mode]
default = "directed"
description = "directed (wake a named replacement to pull) or queue (return to the metadata role pool)"

[[steps]]
id = "read-evidence"
title = "gather evidence that {{actor}} is gone"
type = "task"
priority = 0
labels = ["recovery", "phase:diagnose"]
description = """
Collect, do not judge. The bead's claim -- assignee plus status -- is the only
authority on who owns this work, so start from `bd show {{bead}}`:

- last comment timestamp and last status change
- any actual captured branch identified by the task result or bead evidence:
  verify its ref and head, then use `git cherry <feature-branch> <captured-branch>`
  to inspect integration. Do not derive a branch name from the actor handle.
  Record found, absent, or unknown; absence is not proof no work was produced
- the checkout named in the bead's `metadata.worktree` (the architect's feature
  worktree, not a worker's), and in it `git log` and `git status --porcelain`
- whether {{actor}}'s process and delegated jobs still exist, and whether the
  `hub` roster lists it; unknown liveness is not confirmed absence
- the cross-check: run wt's step eval in that checkout, asking it for the
  bead var, and compare the answer to {{bead}}

A mismatched or missing bead var in the checkout is evidence about the
CHECKOUT -- it may be reused, stale, or never stamped. It is never a licence to
take the bead.

Age alone is never evidence. A long-running build looks identical to a dead
actor from the beads side.
"""

[[steps]]
id = "attempt-resume"
title = "try to resume {{actor}} before displacing it"
type = "task"
needs = ["read-evidence"]
labels = ["recovery", "phase:diagnose"]
description = """
If {{actor}} still exists, contact it about {{bead}} and stop recovery; do not
ask it to re-claim or displace it. Wait for its job outcome through the normal
result channel. Unknown liveness blocks recovery rather than authorizing it.
"""

[[steps]]
id = "confirm-dead"
title = "confirm the claim on {{bead}} may be recovered"
type = "task"
priority = 1
needs = ["attempt-resume"]
labels = ["recovery", "phase:decide"]
description = """
Present the evidence from read-evidence and the exact action intended. Resolve
the human gate with `bd gate resolve <gate-id>` only after user confirmation,
then close this step. The rules:

- NEVER steal a claim because a timestamp is old. Age is not evidence.
- A claim held by an actor that is genuinely gone is recovered ON EVIDENCE
  ONLY -- the actor's absence, shown, not inferred.
- Pre-assignment makes dead claims MORE likely, not less: a bead stamped with
  an actor that never started, or that died before reporting, still reads as
  owned. More pre-assignment means more of these, so the bar for recovery does
  not drop as they get common.

If the evidence does not establish absence, resolve nothing and close this
molecule.
"""

[steps.gate]
type = "human"

[[steps]]
id = "preserve-artifacts"
title = "preserve whatever {{actor}} produced"
type = "task"
needs = ["confirm-dead"]
labels = ["recovery", "phase:repair"]
description = """
Before any artifact, metadata, status, or assignee mutation, establish an
operationally EXCLUSIVE recovery window: stop or exclude every dispatch and
claim writer that could touch this bead, including automated supervisors.
Keep that exclusion through preservation and claim release. Fresh reads and
human consent alone are not race protection. If exclusion cannot be established,
preserve the claim unchanged and report unresolved recovery.

OMP 18.1.14 captures commits plus remaining working-tree delta only after a
successful isolated child result. Failed or aborted runs skip that capture and
may lose local work during cleanup, even if the worker committed early.

Verify any surviving captured branch and its ownership before recording
`recovered_branch` on {{bead}}. Never invent a ref or delete one whose
`git cherry` output still shows `+`. If no branch survives, record that fact and
the possible loss; do not report recovery as successful without evidence.

Any residual isolated checkout needs backend-specific inspection; survival is
not guaranteed. For a dead architect, inspect the checkout in metadata.worktree.
Preserve verified residual changes or artifacts without discarding them or
pushing on the dead actor's behalf. Recheck ownership before any mutation.
"""

[[steps]]
id = "release-claim"
title = "release the claim on {{bead}}"
type = "task"
priority = 1
needs = ["preserve-artifacts"]
labels = ["recovery", "phase:repair"]
description = """
The reaper only records recovery observations; it cannot safely unclaim for you.
Immediately re-read {{bead}} and recheck actor/job absence and approval before
any mutation. If ownership, status, or evidence changed, stop and reassess.
Beads has no compare-and-swap for this transition: retain the operationally
EXCLUSIVE window established before preserve-artifacts, with all dispatch and
claim writers stopped or excluded. If exclusion is lost, preserve the claim
unchanged and report unresolved recovery.

For confirmed unfinished work, clear assignee and set status=open in one
`bd update`; preserve reported/reviewed work for integration rather than reopening
it blindly. Leave metadata.worktree intact unless verified evidence corrects it.
"""

[[steps]]
id = "reassign"
title = "wake a named replacement to pull {{bead}}"
type = "task"
needs = ["release-claim"]
condition = "{{mode}} == directed"
labels = ["recovery", "phase:repair", "route:directed"]
description = """
Leave the bead unassigned. Wake the replacement with its role and queue scope,
not an activation command or a pre-assigned bead. Provision a checkout via
mol-arch-setup only for an architect; isolated workers need no provisioning.
Use the same metadata role query and parent/ephemeral rules as requeue.
For preserved reported/reviewed work, do not wake an implementation replacement:
route the existing evidence to its integration/review owner and skip re-claiming.

"""

[[steps]]
id = "requeue"
title = "return {{bead}} to its metadata role pool"
type = "task"
needs = ["release-claim"]
condition = "{{mode}} == queue"
labels = ["recovery", "phase:repair", "route:queue"]
description = """
Confirm metadata.role and the empty assignee. Architect and implementer pulls use
`bd ready --parent <owner> --metadata-field role=<role> --unassigned --claim --json`;
reviewer and researcher pulls also require `--include-ephemeral`.
Shepherds instead pull
`bd ready --metadata-field role=shepherd --unassigned --claim --json`
without a parent. Never change the role merely to make a queue find the bead.
For preserved reported/reviewed work, retain its status and handoff; this step
does not reopen it merely to make a ready query return it.

"""

[[steps]]
id = "verify-recovered"
title = "verify {{bead}} is claimable again"
type = "task"
needs = ["release-claim", "reassign", "requeue"]
labels = ["recovery", "phase:verify"]
description = """
For reopened work, the role-specific ready query without `--claim` must list
{{bead}}, or its replacement must already hold it. For preserved reported work,
verify a named integration/review owner and the durable evidence instead; being
in_progress and unassigned is expected there. Unknown or blocked outcomes must
be reported explicitly, not described as successful recovery.
"""
