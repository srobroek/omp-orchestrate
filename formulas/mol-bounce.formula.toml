formula = "mol-bounce"
description = "return {{merge_bead}} to its origin worker behind one durable fix bead keyed {{failure_key}}"
type = "workflow"

[vars.merge_bead]
required = true
description = "the merge bead being bounced; stays open and parked, never closed"

[vars.failure_key]
required = true
description = "failure identity over repo, failure kind, and exact detail; a review-bot round is keyed bot:<slug>@<head_sha>"

[vars.route_role]
default = "implementer"
description = "metadata role for the durable code-fix bead; must be implementer"

[[steps]]
id = "dedupe"
title = "look for an existing fix bead keyed {{failure_key}}"
type = "task"
priority = 1
labels = ["bounce", "phase:dedupe"]
description = """
Dedupe FIRST. Search every non-closed fix bead carrying {{failure_key}} before
creating anything. The same key deduplicates sequential passes, so a repeated
bounce of the same failure reuses the existing bead and this molecule stops here.

Keying is what makes that safe. A review-bot round is keyed
`bot:<slug>@<head_sha>` so a new push produces a NEW round rather than reopening a
closed fix bead; a CI or conflict failure keys on repo, kind, and the exact check
name or sorted conflict paths.

On a concurrent creation race keep the OLDEST open fix bead and close the later
one as its duplicate.
"""

[[steps]]
id = "create-fix-bead"
title = "create the unassigned fix bead for {{failure_key}}"
type = "task"
priority = 1
needs = ["dedupe"]
labels = ["bounce", "phase:route"]
description = """
Validate {{route_role}} is implementer before creation. Resolve the owning epic
from {{merge_bead}}'s origin_bead; never copy the unparented merge bead's placement.
Create the unassigned durable fix with `--parent <owning-epic>`,
`--deps discovered-from:{{merge_bead}}`, and metadata `role={{route_role}}`,
`execution_kind=git`, `execution_task_kind=code`, plus the origin work's relevant
scope, repo, base_ref, acceptance criteria, and evidence pointers.
Its consumer pulls
`bd ready --parent <owning-epic> --metadata-field role=implementer --unassigned --claim --json`.

It is a DURABLE bead and never a wisp. The whole mechanism is the blocking
dependency edge park-merge-bead adds next, and that edge dies with a burned wisp:
{{merge_bead}} would silently re-enter the queue with the failure unfixed.

Carry EVIDENCE, not a copy of the findings: the exact PR, branch, failure, check
name, `origin_actor` (the handle the fix routes back to), and `origin_bead` (the
merge bead it came from). For a review-bot round carry POINTERS -- the
summary review URL plus each comment's `path:line` and URL. The bot thread is live
and its diff suggestions render only on the PR, so a copy is stale the moment it
is written.

Unassigned is deliberate. The specialist discovers this work by CLAIMING the fix
bead and does the work in its own isolated workspace -- it never enters the
feature worktree and never pushes. OMP 18.1.14 captures its commits and remaining
working-tree delta on successful completion for the architect to integrate.
Failed or aborted isolated work may not survive cleanup. The orchestrator
routes; it never claims or relays the diagnosis.
"""

[[steps]]
id = "park-merge-bead"
title = "park {{merge_bead}} behind the fix bead"
type = "task"
priority = 1
needs = ["create-fix-bead"]
labels = ["bounce", "phase:route"]
description = """
Add the blocking dependency once: the fix bead blocks {{merge_bead}} and keeps
it out of `bd ready` while the fix is unresolved.

For a fix delivered IN THE SAME PR, closing the fix before landing would create
a cycle. The architect instead verifies the captured fix is integrated into
that PR and that independent review and CI approve its exact current head.
Only then remove the blocking edge with
`bd dep remove {{merge_bead}} <fix-bead>`, recording the verified PR/head and
evidence on both beads. Preserve the discovered-from provenance and the fix's
nonterminal landing record; never close the fix merely to unblock the merge.
The unparented merge bead can now enter the shepherd queue, subject to all
remaining blockers. The shepherd closes the fix only after verifying actual
guarded landing of that approved head.

For a fix delivered in a SEPARATE prerequisite PR, retain the blocking edge
until that prerequisite actually lands and its fix bead legitimately closes.

{{merge_bead}} stays OPEN and parked until the applicable evidence permits it
to re-enter the queue. Closing it, or closing the PR, is not a bounce.
"""

[[steps]]
id = "comment-disposition"
title = "record the disposition on both beads"
type = "task"
needs = ["park-merge-bead"]
labels = ["bounce", "phase:record"]
description = """
Correlate both beads with a stable marker carrying {{failure_key}}, so a later
pass -- or a recovery after a crash mid-bounce -- can find this round instead of
opening a second one.

The comment states what happened and what unblocks it. It never states a verdict
on a review finding: the specialist claiming the fix bead judges which findings
are correct, applies those, and replies on the PR to the rest.
"""

[[steps]]
id = "release-slot"
title = "release the merge slot and the claim on {{merge_bead}}"
type = "task"
priority = 1
needs = ["comment-disposition"]
labels = ["bounce", "phase:release"]
description = """
Release the merge slot, release the claim on {{merge_bead}}, and release the
repository sheepdog with your own `bd` calls. Clear the sheepdog's assignee too --
a closed wisp still naming you refuses the successor's claim.

A bounce is an exit path, and the slot is released on EVERY exit path. A slot held
past a bounce blocks every other landing in the repository with nothing reporting
why; the holder looks alive because the actor is.

Leave the feature worktree alone. It is the architect's, the fix round's branch
still has to be integrated into it, and it is reclaimed only after
{{merge_bead}} finally closes.
"""
