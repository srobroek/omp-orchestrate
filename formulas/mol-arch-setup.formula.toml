formula = "mol-arch-setup"
description = "static preamble the lead completes before launching the native architect for {{owner_bead}}"
type = "workflow"

[vars.repo]
required = true
description = "repository root the worktree is created from"

[vars.branch]
required = true
description = "branch the worktree is created on"

[vars.owner_bead]
required = true
description = "unassigned architect epic this root is provisioned for; the lead prepares and binds it before launching the native architect"

[vars.copies_ignored]
default = "true"
description = "does the build need gitignored inputs copied in"

[[steps]]
id = "create-worktree"
title = "create the worktree for {{branch}}"
type = "task"
priority = 1
labels = ["arch-setup", "phase:provision"]
description = """
wt -C {{repo}} switch --create {{branch}} --no-cd --format=json -y

Use the returned absolute `path` as <worktree> in the remaining steps; do not
derive it from the branch name. Read its existing binding with
`wt -C <worktree> step eval '{{ vars.bead }}' --format json` before stamping it.
Refuse a binding naming another bead or an unresolved read; an absent binding
is expected only for a newly created worktree.

The command does not relocate the spawning session. Establish the native
architect's session at this root before launch; see planning.md.
"""

[[steps]]
id = "bind-vars"
title = "stamp {{owner_bead}} on the worktree and the worktree on {{owner_bead}}"
type = "task"
needs = ["create-worktree"]
labels = ["arch-setup", "phase:provision"]
description = """
wt -C <worktree> config state vars set bead={{owner_bead}} --branch {{branch}}

Then read it back:

wt -C <worktree> step eval '{{ vars.bead }}' --format json

The result must be {{owner_bead}}. This pair -- the bead var on the path and
metadata.worktree on the bead (stamp-owner) -- is the whole binding. It records
where the work lives; it grants nothing and blocks on nothing, so there is no
handshake to complete and nothing to wait on. Activation is a pull: whoever
takes {{owner_bead}} does it with `bd ready ... --claim` and then reads
metadata.worktree to find this tree, cross-checking with the eval above. An
unverified write leaves that cross-check failing at claim time.

This tree is the architect's alone. Workers run in isolated workspaces and
never enter it, so nothing here is provisioned for them.
"""

[[steps]]
id = "verify-writable"
title = "verify the worktree state and writability"
type = "task"
needs = ["bind-vars"]
labels = ["arch-setup", "phase:provision"]
description = """
For a fresh setup, `git -C <worktree> status --porcelain` must print nothing,
and the path must be writable. A resumed tree may be dirty: preserve and inspect
its existing changes and accepted delta; do not reset or clean it merely to
make recovery look fresh. A dirty fresh setup mixes someone else's work into
the first commit made against {{owner_bead}} and must be refused.
"""

[[steps]]
id = "copy-ignored"
title = "copy gitignored build inputs into the worktree"
type = "task"
needs = ["bind-vars"]
condition = "{{copies_ignored}}"
labels = ["arch-setup", "phase:provision"]
description = """
wt -C {{repo}} step copy-ignored --require-include <worktree>

Skip only when the build genuinely needs no untracked inputs. A missing .env or
target/ becomes a build failure attributed to the work rather than to setup.
"""

[[steps]]
id = "stamp-owner"
title = "stamp the worktree path on {{owner_bead}}"
type = "task"
needs = ["verify-writable"]
labels = ["arch-setup", "phase:provision"]
description = """
bd update {{owner_bead}} --metadata '{"worktree":"<abs path>","branch":"{{branch}}"}'

Metadata, not a label: exactly one worktree may be true per bead, and this single
value is what the architect claiming {{owner_bead}} reads to find its tree. Two
worktree labels would be two answers to a question with one answer.
"""

[[steps]]
id = "ready-to-claim"
title = "declare {{owner_bead}} ready to claim"
type = "task"
priority = 1
needs = ["stamp-owner", "copy-ignored"]
labels = ["arch-setup", "phase:provision"]
description = """
Preconditions all true: the worktree exists, its bead var reads {{owner_bead}},
fresh setup is clean (or resumed dirty state is preserved and inspected),
ignored inputs are present, and metadata.worktree is stamped. The lead now launches
the native architect with its actual session cwd at this canonical worktree. Only
then may the architect pull work under {{owner_bead}}:
`bd ready --parent {{owner_bead}} --metadata-field role=<role> --unassigned --claim --json`.
Use role=implementer for implementation and role=architect for child epics;
reviewer and researcher pulls also require `--include-ephemeral`. Shepherds
instead pull `bd ready --metadata-field role=shepherd --unassigned --claim --json`
without a parent, since merge beads are unparented.

The order is the rule, not a preference. A claim is how an actor discovers its
work, and the claim carries no checkout with it. Readying {{owner_bead}} before
this step invites a claim against an unprovisioned tree, and an already-consumed
claim cannot be retried -- undoing it takes dead-claim recovery.
"""
