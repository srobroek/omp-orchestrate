formula = "mol-worker-onboard"
description = "static preamble an implementer, reviewer, or researcher runs before touching {{bead}}"
type = "workflow"

[vars.bead]
required = true
description = "the bead returned by this worker's role-specific claim"

[vars.role]
required = true
description = "metadata role: implementer, reviewer, or researcher only"

[vars.needs_worktree]
default = "true"
description = "false for read-only or artifact-only work that writes no repo files"

[[steps]]
id = "claim-bead"
title = "claim {{bead}} from the {{role}} queue"
type = "task"
priority = 0
labels = ["onboard", "phase:start"]
description = """
bd ready --parent <owner> --metadata-field role={{role}} --unassigned --claim --json

Use the work epic as <owner>. Validate {{role}} as implementer, reviewer, or
researcher before using this formula; no other role is supported.
Reviewer and researcher pulls MUST add `--include-ephemeral`.

Architects use mol-arch-setup and their own Claiming protocol in the provisioned
persistent feature checkout. Shepherds use their own queue/receipt Claiming protocol.
Neither uses this isolated-child onboarding formula.

Code-readonly reviewers and researchers still need Beads mutation access to
claim, write evidence and verdicts, and release their claims; never use `bd --readonly`.

A worker discovers its work by claiming a bead, never from a handle passed in
the prompt. The claim is a database operation and needs no worktree. If it
returns nothing, report NO_WORK and yield without widening the filter. Retry
serialization contention with the identical query; report other errors as BLOCKED.
"""

[[steps]]
id = "resolve-worktree"
title = "confirm the isolated workspace for {{bead}}"
type = "task"
needs = ["claim-bead"]
condition = "{{needs_worktree}}"
labels = ["onboard", "phase:start"]
description = """
Your workspace is the session cwd: OMP provisioned an isolated worktree for this
spawn and captures its commits plus remaining working-tree delta only after a
successful child result in OMP 18.1.14. Failed or aborted isolated work may not
survive cleanup, even if committed locally. Never create, move, or remove a
worktree, and never push.

metadata.worktree on the bead names the ARCHITECT's feature worktree, which is
single-mutator and not yours to enter. Read it only to know where your branch
will be integrated; if you find yourself inside it, stop and report.
"""

[[steps]]
id = "verify-ownership"
title = "verify the workspace is isolated and clean"
type = "task"
needs = ["claim-bead", "resolve-worktree"]
condition = "{{needs_worktree}}"
labels = ["onboard", "phase:start"]
description = """
git rev-parse --show-toplevel must print your session cwd, not the repo root and
not the architect's feature worktree, and git status --porcelain must be clean
before the first edit.

A shared tree means two writers, and the loser's commits are the ones nobody
notices: stop and report rather than editing. Reporting a mis-provisioned
workspace is cheap; untangling mixed commits out of the feature branch is not.
"""

[[steps]]
id = "confirm-scope"
title = "read the scope and acceptance criteria on {{bead}}"
type = "task"
needs = ["claim-bead"]
labels = ["onboard", "phase:start"]
description = """
The bead carries the brief. Read its description, comments, and scope metadata
before the first edit. Work outside the stamped scope is what collides with a
sibling worker.
"""

[[steps]]
id = "begin-work"
title = "begin work on {{bead}}"
type = "task"
needs = ["confirm-scope", "verify-ownership"]
labels = ["onboard", "phase:start"]
description = """
All applicable preconditions hold: bead claimed, scope understood, and an isolated
workspace confirmed clean when needs_worktree=true. Only that path edits files;
needs_worktree=false permits read-only or artifact-only work without repo edits.
"""
