name: pr-body-prose

# Gates human PR bodies. Renovate and release-please bodies are generated;
# rewriting release-please markers can break release parsing (measured on #22).
# Exempt only authenticated PR authors, never titles, labels, or the run actor.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  prose:
    # GitHub REST author IDs: renovate[bot] (#13), sjorsr-release-bot[bot] (#22).
    if: >-
      ${{ !(github.event.pull_request.user.type == 'Bot'
        && (github.event.pull_request.user.id == 29139614
          || github.event.pull_request.user.id == 301724168)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.17.1 --repo errata-ai/vale --pattern 'vale_3.17.1_Linux_64-bit.tar.gz' --dir "$RUNNER_TEMP/vale"
          tar -xzf "$RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" -C "$RUNNER_TEMP/vale"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh pr view "${{ github.event.pull_request.number }}" --json body -q .body > pr-body.md

      - name: Gate PR body
        run: |
          set +e
          uvx --from slopvac==1.0.1 python scripts/prose-gate.py pr-body.md --profile normal --format json > slopvac-pr-body.json
          status=$?
          set -e
          # Exit 1 is a prose threshold failure; retain the errors-only policy.
          # All other nonzero exits mean the tool did not complete reliably.
          case "$status" in
            0|1) ;;
            *)
              echo "slopvac failed to run reliably (exit $status)"
              exit "$status"
              ;;
          esac
          if [ ! -s slopvac-pr-body.json ]; then
            echo "slopvac wrote no report (exit $status)"
            exit 1
          fi
          python3 scripts/check-prose-report.py slopvac-pr-body.json
